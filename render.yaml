services:
  - type: web
    name: trading-news-bot
    runtime: docker
    repo: https://github.com/riyatola/trading-news-bot
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: trading-news-bot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trading-news-bot-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: true
      - key: MEXC_API_KEY
        sync: true
      - key: MEXC_API_SECRET
        sync: true
      - key: TELEGRAM_BOT_TOKEN
        sync: true
      - key: TELEGRAM_CHAT_ID
        sync: true
      - key: FINNHUB_API_KEY
        sync: true

  - type: redis
    name: trading-news-bot-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: trading-news-bot-db
    databaseName: trading_news_bot
    user: trading_news_bot
    plan: starter
    postgresMajorVersion: "16"
